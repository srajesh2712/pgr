<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Hadley Cell Simulator</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

#ui{
    position:absolute;
    left:10px;
    top:10px;
    color:white;
    background:rgba(0,0,0,.8);
    padding:15px;
    border-radius:10px;
    width:300px;
}

input{
    width:100%;
}
</style>
</head>

<body>

<div id="ui">

<h3>Hadley Cell Simulator</h3>

Animation Speed

<input id="speed"
       type="range"
       min="1"
       max="30"
       value="10">

<p>

🔴 Equator Heating<br>

⬆ Rising Air<br>

➡ Poleward Flow Aloft<br>

⬇ Polar Sinking<br>

⬅ Surface Return Flow

</p>

</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">

import * as THREE from
'https://unpkg.com/three@0.160.0/build/three.module.js';

import { OrbitControls } from
'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x000015);

const camera =
new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,3,8);

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

const controls =
new OrbitControls(
camera,
renderer.domElement
);

//
// Earth
//

const earth =
new THREE.Mesh(

new THREE.SphereGeometry(
2,
64,
64
),

new THREE.MeshPhongMaterial({
color:0x2244aa
})

);

scene.add(earth);

//
// Atmosphere
//

const atmosphere =
new THREE.Mesh(

new THREE.SphereGeometry(
2.15,
64,
64
),

new THREE.MeshBasicMaterial({
color:0x88ccff,
transparent:true,
opacity:0.15
})

);

scene.add(atmosphere);

//
// Sun
//

const sun =
new THREE.Mesh(

new THREE.SphereGeometry(
0.4,
32,
32
),

new THREE.MeshBasicMaterial({
color:0xffff00
})

);

sun.position.set(8,0,0);

scene.add(sun);

const light =
new THREE.PointLight(
0xffffff,
5
);

light.position.copy(
sun.position
);

scene.add(light);

//
// Equator Ring
//

const ring =
new THREE.Mesh(

new THREE.TorusGeometry(
2.02,
0.015,
8,
100
),

new THREE.MeshBasicMaterial({
color:0xffaa00
})

);

ring.rotation.x =
Math.PI/2;

scene.add(ring);

//
// Hadley Path
//

const points=[];

for(let t=0;t<=1;t+=0.01){

let x,y,z;

if(t<0.25){

const a=t/0.25;

x=2;
y=a*2;

z=0;

}

else if(t<0.5){

const a=(t-0.25)/0.25;

x=2-a*2;

y=2;

z=0;

}

else if(t<0.75){

const a=(t-0.5)/0.25;

x=0;

y=2-a*2;

z=0;

}

else{

const a=(t-0.75)/0.25;

x=a*2;

y=0;

z=0;

}

points.push(
new THREE.Vector3(x,y,z)
);

}

const curve =
new THREE.CatmullRomCurve3(
points
);

const tube =
new THREE.Mesh(

new THREE.TubeGeometry(
curve,
300,
0.03,
12,
true
),

new THREE.MeshBasicMaterial({
color:0xffff00
})

);

scene.add(tube);

//
// Parcel
//

const parcel =
new THREE.Mesh(

new THREE.SphereGeometry(
0.09,
16,
16
),

new THREE.MeshBasicMaterial({
color:0xff0000
})

);

scene.add(parcel);

let progress=0;

function colorParcel(t){

if(t<0.25)
parcel.material.color.set(
0xff0000
);

else if(t<0.5)
parcel.material.color.set(
0xffffff
);

else if(t<0.75)
parcel.material.color.set(
0x00ffff
);

else
parcel.material.color.set(
0x00ff00
);
}

function animate(){

requestAnimationFrame(
animate
);

const speed =
document.getElementById(
"speed"
).value;

progress +=
0.0005*speed;

if(progress>1)
progress=0;

const p =
curve.getPointAt(
progress
);

parcel.position.copy(p);

colorParcel(progress);

earth.rotation.y += 0.001;

controls.update();

renderer.render(
scene,
camera
);

}

animate();

window.addEventListener(
'resize',
()=>{

camera.aspect=
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
