<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cyclogenesis Interactive Explorer</title>
<style>
body{
    margin:0;
    background:#08131f;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

#controls{
    position:absolute;
    top:10px;
    left:10px;
    background:rgba(0,0,0,0.7);
    padding:10px;
    border-radius:10px;
    z-index:100;
}

button{
    padding:8px;
    margin:3px;
}

input[type=range]{
    width:250px;
}

canvas{
    display:block;
}

#info{
    position:absolute;
    bottom:10px;
    left:10px;
    padding:10px;
    background:rgba(0,0,0,0.7);
    border-radius:10px;
    width:500px;
}
</style>
</head>
<body>

<div id="controls">
    <button onclick="togglePlay()">Play</button>
    <button onclick="setView('top')">Top View</button>
    <button onclick="setView('side')">Side View</button>

    <br><br>

    Stage:
    <input id="slider" type="range" min="0" max="5" value="0">
</div>

<canvas id="c"></canvas>

<div id="info"></div>

<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

function resize(){
   canvas.width=window.innerWidth;
   canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

let stage=0;
let playing=false;
let view="top";
let angle=0;

const infoText=[
"Stage 0: Straight front. Cold air north, warm air south. No cyclone.",
"Stage 1: A wave develops along the front.",
"Stage 2: Low pressure forms. Air starts moving inward.",
"Stage 3: Coriolis effect bends motion. Air begins spiraling.",
"Stage 4: Warm front and cold front organize around the low.",
"Stage 5: Mature cyclone."
];

function togglePlay(){
    playing=!playing;
}

function setView(v){
    view=v;
}

slider.oninput=()=>{
    stage=parseInt(slider.value);
};

function drawTopView(){

    let w=canvas.width;
    let h=canvas.height;

    ctx.fillStyle="#145da0";
    ctx.fillRect(0,0,w,h/2);

    ctx.fillStyle="#ff9933";
    ctx.fillRect(0,h/2,w,h/2);

    ctx.strokeStyle="white";
    ctx.lineWidth=2;

    if(stage===0){
        ctx.beginPath();
        ctx.moveTo(100,h/2);
        ctx.lineTo(w-100,h/2);
        ctx.stroke();
    }

    if(stage>=1){

        ctx.beginPath();

        ctx.moveTo(100,h/2);

        let amp=Math.min(stage*20,80);

        ctx.bezierCurveTo(
            w/3,h/2-amp,
            w/2,h/2+amp,
            w-100,h/2
        );

        ctx.stroke();
    }

    if(stage>=2){

        let cx=w/2;
        let cy=h/2;

        ctx.fillStyle="yellow";
        ctx.beginPath();
        ctx.arc(cx,cy,18,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="black";
        ctx.font="20px Arial";
        ctx.fillText("L",cx-6,cy+7);

        let r=150;

        for(let i=0;i<10;i++){

            let a=i*Math.PI*2/10;

            let x=cx+Math.cos(a)*r;
            let y=cy+Math.sin(a)*r;

            if(stage===2){

                ctx.strokeStyle="white";

                ctx.beginPath();
                ctx.moveTo(x,y);
                ctx.lineTo(cx,cy);
                ctx.stroke();
            }

            if(stage>=3){

                let spiralAngle=a+angle*0.02;

                let x2=cx+Math.cos(spiralAngle)*100;
                let y2=cy+Math.sin(spiralAngle)*100;

                ctx.strokeStyle="cyan";

                ctx.beginPath();
                ctx.moveTo(x,y);
                ctx.quadraticCurveTo(
                    x2,y2,
                    cx,cy
                );
                ctx.stroke();
            }
        }
    }

    if(stage>=4){

        ctx.strokeStyle="red";
        ctx.lineWidth=4;

        ctx.beginPath();
        ctx.moveTo(w/2,h/2);
        ctx.lineTo(w/2+160,h/2-120);
        ctx.stroke();

        ctx.strokeStyle="blue";

        ctx.beginPath();
        ctx.moveTo(w/2,h/2);
        ctx.lineTo(w/2+80,h/2+170);
        ctx.stroke();

        ctx.fillStyle="white";
        ctx.fillText("Warm Front",w/2+180,h/2-120);
        ctx.fillText("Cold Front",w/2+100,h/2+180);
    }

}

function drawSideView(){

    let w=canvas.width;
    let h=canvas.height;

    ctx.fillStyle="#112";
    ctx.fillRect(0,0,w,h);

    ctx.strokeStyle="white";

    let ground=h*0.75;

    ctx.beginPath();
    ctx.moveTo(50,ground);
    ctx.lineTo(w-50,ground);
    ctx.stroke();

    if(stage<3){

        ctx.fillStyle="#4fc3f7";

        ctx.fillRect(
          100,
          ground-120,
          w/2,
          120
        );

        ctx.fillStyle="#ffb74d";

        ctx.fillRect(
          w/2,
          ground-120,
          w/2-100,
          120
        );
    }

    if(stage>=3){

        ctx.fillStyle="#4fc3f7";

        ctx.beginPath();

        ctx.moveTo(100,ground);
        ctx.lineTo(w/2,ground);

        ctx.lineTo(w/2+100,ground-120);

        ctx.lineTo(100,ground-120);

        ctx.fill();

        ctx.fillStyle="#ffb74d";

        ctx.beginPath();
        ctx.moveTo(w/2,ground);
        ctx.lineTo(w-100,ground);

        ctx.lineTo(w-100,ground-240);

        ctx.lineTo(w/2+100,ground-120);

        ctx.fill();

        ctx.strokeStyle="white";

        ctx.beginPath();
        ctx.moveTo(w/2+50,ground-40);
        ctx.quadraticCurveTo(
          w/2+130,
          ground-120,
          w/2+220,
          ground-180
        );
        ctx.stroke();

        ctx.fillStyle="white";
        ctx.fillText(
          "Warm air rises over cold air",
          w/2+150,
          ground-200
        );
    }

    if(stage>=5){

        for(let i=0;i<6;i++){

            let x=w/2+180+i*30;
            let y=ground-180-i*15;

            ctx.fillStyle="white";
            ctx.beginPath();
            ctx.arc(x,y,10,0,Math.PI*2);
            ctx.fill();
        }

        ctx.fillText("Clouds / Rain",w/2+250,ground-260);
    }
}

function animate(){

    requestAnimationFrame(animate);

    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(playing){

        angle++;

        if(angle%120===0){

            stage++;

            if(stage>5) stage=0;

            slider.value=stage;
        }
    }

    if(view==="top")
         drawTopView();
    else
         drawSideView();

    document.getElementById("info").innerHTML=
         "<b>"+view.toUpperCase()+" VIEW</b><br><br>"
         +infoText[stage];
}

animate();

</script>

</body>
</html>
