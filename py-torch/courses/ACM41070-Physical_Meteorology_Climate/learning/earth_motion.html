<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Earth Heating Simulator</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    width:360px;
    background:rgba(0,0,0,0.75);
    color:white;
    padding:15px;
    border-radius:10px;
    z-index:100;
}

h2{
    margin-top:0;
}

input[type=range]{
    width:100%;
}

button{
    margin-top:10px;
    padding:8px 12px;
    cursor:pointer;
}

#description{
    margin-top:15px;
    font-size:14px;
    color:#ddd;
    line-height:1.4;
}

</style>
</head>
<body>

<div id="ui">

<h2>🌍 Differential Heating Simulator</h2>

<b>☀ Sun Energy</b>

<input
id="sunSlider"
type="range"
min="50"
max="200"
value="100">

<div id="sunLabel">
100%
</div>

<br>

<b>⏩ Simulation Speed</b>

<input
id="speedSlider"
type="range"
min="1"
max="50"
value="10">

<div id="speedLabel">
1.0×
</div>

<button id="pauseBtn">
Pause
</button>

<button id="resetBtn">
Reset View
</button>

<div id="description">

Red = warm equatorial regions

Blue = cold polar regions

White particles:
moving atmosphere

Drag mouse to rotate camera.

</div>

</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import { OrbitControls }
from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

//
// Scene
//

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x000000);

const camera =
new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(
0,
1,
7
);

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

//
// Orbit Controls
//

const controls =
new OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping=true;

//
// Sun
//

const sunMaterial =
new THREE.MeshBasicMaterial({
color:0xffff00
});

const sun =
new THREE.Mesh(
new THREE.SphereGeometry(
0.4,
32,
32
),
sunMaterial
);

sun.position.set(
8,
0,
0
);

scene.add(sun);

//
// Sun Light
//

const light =
new THREE.DirectionalLight(
0xffffff,
2
);

light.position.set(
8,
0,
2
);

scene.add(light);

//
// Earth
//

const earthGeometry =
new THREE.SphereGeometry(
2,
128,
128
);

function applyTemperatureColors(energy){

const pos =
earthGeometry.attributes.position;

const colors=[];

for(let i=0;i<pos.count;i++){

const y =
pos.getY(i);

const latitude =
Math.abs(y/2);

let heat =
(1-latitude)
* energy;

heat =
Math.min(1,heat);

colors.push(
heat,
0,
1-heat
);

}

earthGeometry.setAttribute(
'color',
new THREE.Float32BufferAttribute(
colors,
3
)
);

}

applyTemperatureColors(1);

const earthMaterial =
new THREE.MeshPhongMaterial({
vertexColors:true
});

const earth =
new THREE.Mesh(
earthGeometry,
earthMaterial
);

scene.add(earth);

//
// Latitude Lines
//

function latitudeLine(
y,
color
){

const radius =
Math.sqrt(
4-y*y
);

const points=[];

for(let a=0;a<=360;a++){

const t =
a*Math.PI/180;

points.push(
new THREE.Vector3(
radius*Math.cos(t),
y,
radius*Math.sin(t)
)
);

}

const geometry =
new THREE.BufferGeometry()
.setFromPoints(points);

const line =
new THREE.Line(

geometry,

new THREE.LineBasicMaterial({
color:color
})

);

earth.add(line);

}

latitudeLine(0,0xffff00);
latitudeLine(0.8,0xff9900);
latitudeLine(-0.8,0xff9900);
latitudeLine(1.84,0x00ffff);
latitudeLine(-1.84,0x00ffff);

//
// Labels
//

function makeSprite(
text,
color,
y
){

const canvas =
document.createElement('canvas');

canvas.width=512;
canvas.height=128;

const ctx =
canvas.getContext('2d');

ctx.fillStyle=color;
ctx.font='60px Arial';
ctx.fillText(
text,
20,
80
);

const texture =
new THREE.CanvasTexture(
canvas
);

const sprite =
new THREE.Sprite(

new THREE.SpriteMaterial({
map:texture
})

);

sprite.position.set(
3.2,
y,
0
);

sprite.scale.set(
2,
0.5,
1
);

earth.add(sprite);
}

makeSprite("0°","#ffff00",0);
makeSprite("23.5°N","#ff9900",0.8);
makeSprite("23.5°S","#ff9900",-0.8);
makeSprite("66.5°N","#00ffff",1.84);
makeSprite("66.5°S","#00ffff",-1.84);

//
// Atmosphere particles
//

const particles=[];

for(let i=0;i<400;i++){

const particle =
new THREE.Mesh(

new THREE.SphereGeometry(
0.02,
8,
8
),

new THREE.MeshBasicMaterial({
color:0xffffff
})

);

scene.add(particle);

particles.push(particle);
}

//
// Controls
//

let speed=1;
let paused=false;
let sunEnergy=1;

const speedSlider =
document.getElementById(
"speedSlider"
);

const speedLabel =
document.getElementById(
"speedLabel"
);

speedSlider.oninput=e=>{

speed=
e.target.value/10;

speedLabel.innerHTML=
speed.toFixed(1)+"×";

};

const sunSlider =
document.getElementById(
"sunSlider"
);

sunSlider.oninput=e=>{

sunEnergy=
e.target.value/100;

document.getElementById(
"sunLabel"
).innerHTML=
e.target.value+"%";

applyTemperatureColors(
sunEnergy
);

earthGeometry.attributes.color.needsUpdate=true;

};

document
.getElementById(
"pauseBtn"
)
.onclick=()=>{

paused=!paused;

document.getElementById(
"pauseBtn"
).innerHTML=
paused
? "Play"
: "Pause";

};

document
.getElementById(
"resetBtn"
)
.onclick=()=>{

camera.position.set(
0,
1,
7
);

controls.target.set(
0,
0,
0
);

controls.update();

};

//
// Particle Motion
//

function updateParticles(time){

particles.forEach((p,i)=>{

const angle =
i*0.15;

const x =
Math.cos(angle)*2.4;

const z =
Math.sin(angle)*2.4;

const latitude =
Math.sin(angle)*1.5;

const flow =
(time*0.0003*speed+i*0.01)%1;

if(Math.abs(latitude)<0.4){

p.position.set(
x,
flow*2,
z
);

}
else if(latitude>0){

p.position.set(
x,
1.8-flow*1.5,
z
);

}
else{

p.position.set(
x,
-flow*2,
z
);

}

});

}

//
// Animation
//

function animate(time){

requestAnimationFrame(
animate
);

if(!paused){

earth.rotation.y +=
0.002*speed;

}

updateParticles(time);

controls.update();

renderer.render(
scene,
camera
);

}

animate();

//
// Resize
//

window.addEventListener(
'resize',
() => {

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
